[package]
name = "cadet-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
cadet-kernel = { version = "0.1.0", path = "../cadet-kernel" }
cadet-sketch = { version = "0.1.0", path = "../cadet-sketch" }
glam = { version = "0.34", features = ["serde"] }
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
