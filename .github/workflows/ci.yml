name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Short target dir (Windows path length)
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgtk-3-dev
      # OCCT takes 10-30 min to compile; it lives outside the profile dirs, so cache it separately.
      - uses: actions/cache@v4
        with:
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/OCCT
          key: occt-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: occt-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
