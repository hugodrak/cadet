name: ci

on:
  push:
    branches: [main]
  # Drafts don't run CI; marking a PR ready (or pushing to a ready PR) does. With DRAFT_PRS on,
  # new PRs are turned into drafts (draft.yml), so CI also skips the "opened" event.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    if: ${{ !github.event.pull_request.draft && !(github.event.action == 'opened' && vars.DRAFT_PRS == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    if: ${{ !github.event.pull_request.draft && !(github.event.action == 'opened' && vars.DRAFT_PRS == 'true') }}
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Short target dir (Windows path length)
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgtk-3-dev
      # OCCT takes 10-30 min to compile; it lives outside the profile dirs, so cache it separately.
      # Saved even when a later step fails, so a red run doesn't rebuild it next time.
      - uses: actions/cache/restore@v4
        id: occt
        with:
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/OCCT
          key: occt-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: occt-${{ runner.os }}-
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - uses: actions/cache/save@v4
        if: always() && steps.occt.outputs.cache-hit != 'true'
        with:
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/OCCT
          key: occt-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - name: Test
        run: cargo test --workspace --locked
