name: draft

# New PRs start as drafts; CI runs once they're marked "Ready for review".
# Turned on by the repo variable DRAFT_PRS=true. Converting to draft needs a token in the
# DRAFT_TOKEN secret (fine-grained, this repo, Pull requests: read and write); GITHUB_TOKEN can't.
# pull_request_target can write to PRs from forks. It never checks out PR code, so it's safe.
on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  draft:
    if: ${{ vars.DRAFT_PRS == 'true' && !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DRAFT_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr ready --undo "$PR" -R "$REPO"
          gh pr comment "$PR" -R "$REPO" --body "Thanks! This PR starts as a draft. Press **Ready for review** when it's done, and CI will run."
