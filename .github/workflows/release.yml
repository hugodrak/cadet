name: release

# Actions → release → Run workflow → enter a version. Bumps the crates, tags main as v<version>,
# builds every installer and publishes a GitHub release. Pushing a v* tag by hand also works.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        name: Bump version and tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION="${VERSION#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::'$VERSION' isn't a version like 1.2.3"; exit 1; }
          [ "$GITHUB_REF_NAME" = "main" ] || { echo "::error::Run this from main"; exit 1; }
          git fetch --tags
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null && { echo "::error::v$VERSION already exists"; exit 1; }
          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" crates/*/Cargo.toml
          python3 - "$VERSION" <<'EOF'
          import re, sys
          lock = open("Cargo.lock").read()
          lock = re.sub(r'(name = "cadet-[a-z]+"\nversion = )"[^"]*"', rf'\1"{sys.argv[1]}"', lock)
          open("Cargo.lock", "w").write(lock)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/*/Cargo.toml Cargo.lock
          git diff --cached --quiet || git commit -m "Release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main "v$VERSION"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, name: macos-arm64, formats: "app,dmg" }
          - { os: macos-15-intel, name: macos-x64, formats: "app,dmg" }
          - { os: windows-latest, name: windows-x64, formats: "nsis" }
          - { os: ubuntu-22.04, name: linux-x64, formats: "appimage,deb" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Short target dir (Windows path length)
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=C:\t" >> $env:GITHUB_ENV
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libgtk-3-dev
      - uses: actions/cache@v4
        with:
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/OCCT
          key: occt-release-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: occt-release-${{ matrix.name }}-
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Test
        run: cargo test --release --workspace --locked
      - name: Install cargo-packager
        run: cargo install cargo-packager --locked
      - name: Package
        run: cargo packager --release -p cadet-app --formats ${{ matrix.formats }}
      - uses: actions/upload-artifact@v4
        with:
          name: cadet-${{ matrix.name }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  publish:
    needs: [prepare, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Cadet ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Download
            | OS | File |
            |---|---|
            | macOS, Apple Silicon | `Cadet_*_aarch64.dmg` |
            | macOS, Intel | `Cadet_*_x64.dmg` |
            | Windows | `Cadet_*_x64-setup.exe` |
            | Linux | `Cadet_*_amd64.AppImage` or `.deb` |

            The builds aren't code-signed. **macOS:** open the app once, then System Settings → Privacy & Security → **Open Anyway**. **Windows:** SmartScreen → More info → **Run anyway**.
          files: dist/*
